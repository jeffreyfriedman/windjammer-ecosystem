# Windjammer compiler pin.
#
# The ecosystem apps and packages are built and tested in CI with the Windjammer compiler (`wj`) at the
# commit below. CI never uses a floating branch. `wj` reads this table and reports a mismatch with the
# running binary (`wj doctor` shows the fix).
#
# Status: VERIFIED for the ecosystem loop. Sweep at this commit (interpreted `wj test --interpret` and
# compiled `wj test`, per package and app, 2026-11-10): 74 of 74 targets are green in both modes
# (`docs/STDLIB_GRADUATION.md`), and the compiler's `scripts/ecosystem_width_gate.wj` passes 9 of 9.
# The commit must exist on `repo` before CI can fetch it.
#
# Pin policy:
# - `wj` is the compiler's source key (the ten hex digits of `wj --version` after `+`; `wj doctor --pin` prints the line). It names the sources by content, so it survives history rewrites, copies and checkouts. Never a branch or `tip`.
# - `.github/workflows/ci.yml` (`WINDJAMMER_REF`) names the commit CI builds; the build jobs fail if the built wj does not carry the pinned key.
# - Bump it only in a commit that shows the ecosystem CI loop green with the new compiler. One bump per commit.

[toolchain]
wj = "7dc9161a75"
repo = "https://github.com/jeffreyfriedman/windjammer.git"
