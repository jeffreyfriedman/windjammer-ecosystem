[package]
name = "wj-cli-ui"
version = "0.1.0"
edition = "2025"

[lib]

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true

# Colour detection reads NO_COLOR and TERM; prompts read answers from standard input.
[capabilities]
env.read = ["NO_COLOR", "TERM"]
fs.read = ["/dev/stdin"]
